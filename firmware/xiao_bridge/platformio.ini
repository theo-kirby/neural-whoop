; XIAO ESP32-S3 MSP bridge (sim2real branch B, docs/SIM2REAL.md).
;   pio run -e xiao_bridge -t upload && pio device monitor
; Pre-solder smoke test (WiFi join + UDP LED toggle, no FC needed):
;   pio run -e blink_test -t upload && pio device monitor
[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_bridge]
build_src_filter = +<main.cpp>
; VL53L1X ToF (CJMCU-531 breakout) on the stock I2C pins — optional at runtime, the bridge
; boots and proxies without it. The PMW3901 optical-flow driver (include/pmw3901.h) is
; header-only over the core SPI library, so it adds no lib_deps and is likewise optional.
lib_deps = pololu/VL53L1X @ ^1.3.1

; --- ESP-NOW link (docs/ESPNOW.md) ---------------------------------------------------------
; WiFi/UDP above stays the DEFAULT build; these three envs are the peer-to-peer alternative,
; so rollback is a reflash of xiao_bridge with no code change. All of them need
; include/espnow_config.h (copy the .example, fill in the MACs printed by mac_probe).

; Same drone-side bridge, ESP-NOW instead of UDP. Everything else — ToF interception, the
; loop_max/per-section timers, the LED, the FC UART — is the identical code path.
[env:xiao_bridge_espnow]
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DNW_LINK_ESPNOW
lib_deps = pololu/VL53L1X @ ^1.3.1

; --- Over-the-air reflash (the "one USB flash, ever" workflow) ----------------------------
; After final assembly the drone XIAO's USB port is unreachable, so firmware changes arrive
; over WiFi (ArduinoOTA, port 3232). Open the window first — `bench.py ota` through the
; dongle, or the boot-rescue fallback (power-cycle, wait ~2 min with no host traffic) — then
; upload with the matching _ota env. The WiFi/UDP build serves OTA full-time; no window needed.
; Same binaries as their parents; only the upload transport differs.
[env:xiao_bridge_ota]
build_src_filter = +<main.cpp>
lib_deps = pololu/VL53L1X @ ^1.3.1
upload_protocol = espota
upload_port = whoop-bridge.local

[env:xiao_bridge_espnow_ota]
build_src_filter = +<main.cpp>
build_flags = ${env.build_flags} -DNW_LINK_ESPNOW
lib_deps = pololu/VL53L1X @ ^1.3.1
upload_protocol = espota
upload_port = whoop-bridge.local

; Desk-side USB dongle: USB CDC <-> ESP-NOW proxy. No FC, no sensors.
[env:espnow_dongle]
build_src_filter = +<espnow_dongle.cpp>

; Same dongle source with the radio bypassed: frames are echoed straight back out USB. Bring-up
; step 2 — proves the CDC framing before ESP-NOW is in the picture.
[env:espnow_loopback]
build_src_filter = +<espnow_dongle.cpp>
build_flags = ${env.build_flags} -DDONGLE_LOOPBACK

; Prints this board's STA MAC in espnow_config.h form. Run once per board.
[env:mac_probe]
build_src_filter = +<mac_probe.cpp>

[env:blink_test]
build_src_filter = +<blink_test.cpp>

; UART wiring probe: pairs with Betaflight CLI `serialpassthrough uart1 115200`.
[env:uart_probe]
build_src_filter = +<uart_probe.cpp>

; I2C wiring probe: idle line levels (is VIN live?) + address scan over every candidate
; pin pair. No WiFi, no FC. Run when initTof() reports "no VL53L1X on I2C".
[env:i2c_scan]
build_src_filter = +<i2c_scan.cpp>

; PMW3901 wiring probe + the count-scale calibration rig. No WiFi, no FC. Run when initFlow()
; reports "no PMW3901 on SPI", and again (on purpose) to measure rad_per_count.
[env:flow_probe]
build_src_filter = +<flow_probe.cpp>

; FC UART wiring probe: which pins is the MSP UART on? Needs the battery IN (props off).
; Run when 'tof' works but 'info' times out.
[env:uart_scan]
build_src_filter = +<uart_scan.cpp>

; Multimeter-paced continuity test: toggles each configured flow net at 1 Hz so a meter on
; the BREAKOUT pad proves the wire end-to-end (DC volts only — no beep mode needed). Any
; serial keypress advances to the next net. Run when flow_probe/the bridge report the chip
; absent but the pin config matches the iron.
[env:wire_test]
build_src_filter = +<wire_test.cpp>

; Last-resort flow probe: bit-banged SPI mode 3 at ~1 kHz, pins via -D. If THIS reads
; 0xFF/0x00 on proven wires, no functioning PMW3901 is attached — replace the breakout.
[env:flow_bitbang]
build_src_filter = +<flow_bitbang.cpp>

; Independent-implementation probe: the canonical Bitcraze_PMW3901 library (the one every
; forum thread uses) instead of our pmw3901.h — rules "wrong library" in or out. Pins via -D.
[env:flow_bitcraze]
build_src_filter = +<flow_bitcraze.cpp>
lib_deps = https://github.com/bitcraze/Bitcraze_PMW3901.git
