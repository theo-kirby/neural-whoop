# Optional one-way mirror (backend/mirror.md). Declared 2026-08-09 so `doctor` and
# `roots --mint` can run; NOTE the fallback in `mirror_root_ids` resolves to the
# record/state roots, which here ARE the frozen `archive:` roots — so this project
# CANNOT push until `mirror_roots:` is minted below.
mirror: flywheel

# The account that owns the mirror roots. Pinned so a run with a key from another
# account reports "wrong account" instead of "the graph is missing" — the same
# symptom as a deleted graph, and not the same thing. From `mirror doctor`.
mirror_account_id: be9833b0-502f-477a-ad2d-07dd5c871e10

# The frozen pre-adoption graph (SPEC: Adoption epochs). This project forked it on
# 2026-08-09 and never writes to it again. The whole 189-node subgraph reachable
# from the root below was imported verbatim with `hypergraph import --fork`, so
# every node file here carries its archive identity in `origin:`. Artifacts did
# NOT travel — node files have no artifact operation — so this block is the only
# pointer to them. 137 of the 189 nodes carry at least one artifact on the
# archive: the standard visual packs (replay.json.gz, trajectory.png, fpv_*.png,
# training_curves.png, comparison.png, table.csv, eval.json, run.json — see
# docs/VISUAL_CONTRACT.md), plus exported policies. Read them at
# flywheel.paradigma.inc.
archive:
  backend: flywheel
  roots:
    - node_id: 51aabea1-f793-534d-a0a7-bc9b1e368bbb
      slug: morning-feather-7342
      title: 'neural-whoop: GPU-parallel, swarm-capable whoop RL lab'
  imported: 189
  artifacts: retained-on-archive
  note: >-
    Frozen pre-adoption Flywheel graph, 2026-06-26 → 2026-08-08. Read-only.
    765 artifacts across 137 nodes stayed behind; the node bodies, summaries,
    slugs, node_ids and full multi-parent topology all travelled.

