# hover_tof_air65_w128u15_r25: SENSOR-RATE CORRECTION on the shipped baseline.
# ONE factor vs hover_tof_air65_w128u15.yaml (the deployed studio-baseline): task.tof_rate_hz
# 40.0 -> 25.0. Everything else identical.
#
# Why: the 2026-07-30 bench flights measured the pilot's genuinely-fresh range rate at
# 24.8-27.1 Hz across five flights (distinct tof_m values per second; the log loop itself ran
# 41-44 Hz, so this is the sensor/link, not the sampler). The VL53L1X free-runs at 25 ms and
# polling + UDP jitter eats the rest, so the 40 Hz the ladder trained against never existed on
# hardware — every policy in the ladder saw a height channel ~1.6x fresher than the one it
# actually flies. This config closes that gap; a hold is now ~2 control steps, not ~1.25.
#
# Expect the height channel to be staler and more staircased than the parent saw. If nominal
# hold_rate survives, this is a free faithfulness win and becomes the new baseline; if it
# degrades, that degradation was ALWAYS there in deployment and the ladder was measuring an
# optimistic sim (the honest-but-unwelcome outcome — record it either way).

run:
  name: hover_tof_air65_w128u15_r25

task:
  name: hover_tof
  episode_len: 1500
  pos_sigma: 0.6
  pos_scale: 1.0
  dist_penalty: 0.2
  upright_scale: 1.5
  upright_sigma: 0.5
  vel_penalty: 0.05
  spin_penalty: 0.01
  alive_bonus: 0.1
  smoothness_penalty: 0.004
  crash_penalty: 10.0
  hold_radius: 0.35
  arena_radius: 3.5
  z_min: 0.5
  z_max: 1.1
  hold_fraction: 0.5
  spawn_offset: 1.0
  spawn_vel: 1.0
  spawn_tilt_deg: 30.0
  spawn_rate: 2.0
  tof_rate_hz: 25.0            # <-- the one factor (parent: 40.0)
  tof_max_m: 1.3
  tof_tilt_limit_deg: 45.0

env:
  n_envs: 8192
  seed: 0
  obs_stack: 8

dr:
  enabled: true
  wind_accel_mps2: 1.0
  rate_gain_frac: 0.15
  thrust_scale_frac: 0.05      # tight: deployment calibrates hover throttle on the bench
  obs_noise_std: 0.0           # superseded by the per-channel list below
  #                        [roll,  pitch, p,     q,    r,    h_err]  (rad, rad/s, m)
  obs_noise_std_channels: [0.02,  0.02,  1.25,  1.1,  0.75, 0.02]
  obs_noise_amp_range:    [0.5, 2.0]   # per-episode amplitude factor (see header)
  obs_bias_channels:      [0.0,   0.0,   0.05,  0.05, 0.05, 0.03]
  action_latency_steps: 5
  impulse_prob: 0.02
  impulse_vel_mps: 2.5
  impulse_rate_rps: 4.0

# Air65 II + XIAO companion, tightened to the weighed/spec ~30 g AUW band.
whoop:
  mass: [0.030, 0.028, 0.032]
  J_xy: [2.1e-5, 1.8e-5, 2.5e-5]
  J_z:  [3.5e-5, 3.0e-5, 4.0e-5]

ppo:
  total_steps: 3_200_000_000
  num_steps: 24
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 8
  clip_coef: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  hidden_sizes: [128, 128]
  activation: tanh
  init_log_std: -0.5
  dr_curriculum_frac: 0.5
  ckpt_interval_updates: 800
