# Desk-Flow — a 0.20 m hover on rangefinder + optical flow. Arm 1, and the first policy in this
# lab that carries BOTH bridge sensors into a real flight.
#
# NOT AN ABLATION of Desk-Hover: it changes the task (hover_tof -> hover_flow, obs 6 -> 8) AND the
# operating point (0.10 -> 0.20 m). configs/desk-flow-noflow.yaml is the one-factor control that
# makes any number here attributable — it holds this file's operating point, box, reward, DR, mass
# band, PPO block and seed and changes EXACTLY the two flow channels. Read them as a pair.
#
# Parents: desk-hover (the desk reward/DR shape and the four-gate battery this one is graded by)
# and flow-hover (the flow sensor model, and the sim result that motivated flying it —
# keen-mist-5478: the flow channel took full-DR pure-hold survival 25.6% -> 62.0%; and
# staid-moon-7407: zeroing the channel drops the SAME policy to 16.8%, BELOW the arm that never
# had it, so the win is causally the channel and the policy genuinely depends on it).
#
# WHY 0.20 m AND NOT DESK-HOVER'S 0.10, OR FLOW-HOVER'S 0.40. The setpoint is forced from below by
# the sensor and from above by the desk, and 0.20 is where every margin is comfortable rather than
# merely sufficient. The first cut of this config used 0.15; it was raised on 2026-08-12 because
# every quantity that sets the floor is UNCALIBRATED, and 0.15 bought only 28 mm of margin against
# them (see runs/desk-flow_0p15/, the 0.15 m arm, kept):
#
#   * FLOOR (the sensor). The PMW3901 is optically blind below 80 mm — a hard limit, not a noise
#     floor. Desk-Hover's shipped policy holds 0.0824 m against its 0.10 m setpoint
#     (runs/desk-hover/probes_desk_desk-hover.json, purehold_clean), i.e. an ~1.8 cm sink. At a
#     0.10 m target the flow sensor would sit 2.4 mm above blind, and with the UNCALIBRATED
#     +23.9 mm ToF offset the real drone settles near 0.076 m — actually blind, which the knockout
#     probe measured as the worst state of all. At 0.20 m the same sink lands at 0.182 m (0.158 m
#     with the offset): 102 mm of margin, 78 mm even uncalibrated — i.e. the sensor stays in range
#     even if the sink and the offset BOTH come in at their measured worst.
#   * SCALE. Velocity is (counts/dt) * rad_per_count * HEIGHT, so a height error is a velocity
#     error one-for-one. The +23.9 mm offset is 24% of 0.10 m, 16% of 0.15 m, 12% of 0.20 m.
#   * HANDOVER. RISE_THRUST 1.06 for RISE_S 0.5 from LIFT_VZ 0.20 (pilot/config.py) hands the
#     policy the aircraft at ~0.20-0.25 m climbing at ~0.5 m/s, and those are MODULE CONSTANTS with
#     no FlightParams override. At a 0.20 m setpoint the handover is essentially ON target; at
#     0.15 the policy was handed a drone ABOVE its setpoint and had to descend TOWARD the blind
#     zone as its first act in the air.
#   * CEILING / FLOOR MARGIN. 20 cm under the setpoint (vs Desk-Hover's 8), and the measured
#     ~0.37 m climb overshoot peaks at 0.57 m — 2.3x inside the VL53L1X's 1.3 m ceiling. The
#     2026-07-31 saturate-and-hold crash chain stays structurally absent, which was Desk-Hover's
#     whole reason for existing. It is still desk scale: the worst case is a 20 cm drop.
#
# HONEST SCOPE — this is a DRIFT-RATE controller, not a station-keep. The obs carries velocity,
# not position, deliberately (tasks/hover_flow.py: an integrated flow position drifts without
# bound and nothing in the obs observes the drift). The policy can learn to STOP moving; it cannot
# learn to come back to a point it has already left. Expect mean_xy_error well below Desk-Hover's
# and NOT zero. If it does read ~zero, suspect the sim before believing it.
#
# WATCH flow_valid_rate. A policy can post a fine mean_xy_error while flying most of the episode on
# a channel that faded to zero — an open-loop policy wearing a closed-loop metric. That is gate 5
# of the battery, and it exists because staid-moon-7407 showed the fade is NOT a safe fallback.
#
# UNCALIBRATED KNOBS, stated rather than buried. flow_rate_hz / flow_dropout_prob /
# flow_blackout_prob / flow_gyro_residual and the two flow obs-noise entries are PLACEHOLDERS
# until the Phase-0 passive calibration flight lands (the shipped desk-hover policy at
# --target-height 0.20 with --log-flow; the README slide test gives rad_per_count, the flight
# gives the rest). Same debt the ToF carried between 2026-07-13 and the 2026-07-30
# characterization — and THAT one was optimistic by 1.6x, so treat these the same way.
#
# env: / ppo: are UNCHANGED from Desk-Hover ([128,128], obs_stack 8, n_envs 8192, 3.2e9). NOT
# [192,192]: hollow-shore-3969 measured that width fixes the trim and costs 8.6 points of survival.

run:
  name: desk-flow

task:
  name: hover_flow
  episode_len: 1500
  # --- reward, on Desk-Hover's desk-scale rescale, re-aimed at 0.20 m ---
  # pos_sigma tracks the setpoint (Desk-Hover: 0.10 at 0.10 m), which is what keeps a vertical
  # bias costing a comparable FRACTION of the per-step reward at either scale. At pos_sigma 0.6
  # (the 1 m ladder's) a 5 cm bias costs 0.017/step against ~2.6/step — 0.65% — while a crash
  # costs ~1960 return, so the policy would learn to hover high and every reward number would
  # still look fine.
  pos_sigma: 0.20
  pos_scale: 1.0
  dist_penalty: 2.0            # per-metre gain scales inversely with the arena; the arena is
                               # Desk-Hover's (+-0.60 m), so this is Desk-Hover's value
  upright_scale: 1.5
  upright_sigma: 0.5
  vel_penalty: 0.05
  spin_penalty: 0.01
  alive_bonus: 0.1
  smoothness_penalty: 0.004
  crash_penalty: 10.0
  hold_radius: 0.20            # == pos_sigma, the convention at every other scale
  # --- the desk ---
  # arena_radius 0 pins the setpoint at the desk centre. Also a CORRECTNESS fix at this scale:
  # is_crashed measures |x|,|y| from the ORIGIN (reward.py), so a sampled setpoint makes the crash
  # box asymmetric about it. And the setpoint's xy is invisible to this obs anyway (the policy
  # sees velocity, not position), so sampling it is pure unlearnable noise.
  arena_radius: 0.0
  z_min: 0.17
  z_max: 0.23                  # narrow desk band around 0.20; the purehold twin pins 0.20
  hold_fraction: 0.5
  spawn_offset: 0.20           # covers the pilot's takeoff handover: RISE_THRUST 1.06 for RISE_S
                               # 0.5 from LIFT_VZ 0.20 (pilot/config.py) hands to the policy at
                               # ~0.20-0.25 m climbing at ~0.5 m/s. Those are MODULE CONSTANTS
                               # with no FlightParams override, so there is no per-flight knob for
                               # a sub-0.3 m target (docs/SIM2REAL.md) — the training distribution
                               # is the only place that state gets covered. At THIS setpoint the
                               # handover lands on target rather than above it, but the spawn
                               # spread still has to cover the whole climb-out either way.
  spawn_vel: 0.6               # ~the handover climb rate. NOT flow-hover's 0.8: that was sized
                               # for a +-1.2 m box, and at +-0.6 m a 0.8 m/s draw crosses the
                               # whole arena in 0.75 s, which is unrecoverable by construction
                               # rather than a test of the velocity channel.
  spawn_tilt_deg: 20.0
  spawn_rate: 1.5
  spawn_z_margin: 0.005        # the old hard-coded 0.2 would clamp every spawn to >= 0.21 m —
                               # above the whole band — and silently delete the pure-hold cohort
  bound_xy: 0.60               # the desk: +/-0.6 m (square, so the corner is 0.85 m)
  bound_z_min: 0.010           # ~ WHOOP_REST_Z_M 0.0092 (contract.py): the airframe touched the desk
  bound_z_max: 0.80
  band_ceiling_m: 0.60         # METRIC ONLY (no reward, no termination): 3x the setpoint, as
                               # Desk-Hover's 0.30 was at 0.10 m
  vxy_penalty: 0.0             # ARM 1, and deliberately so. On Desk-Hover this was the only lever
                               # PPO had against drift it could not see, and soft-breeze-8148
                               # measured that lever NO-GO (it bought drift and paid floor margin).
                               # Here the policy can SEE the quantity the penalty was a proxy for,
                               # so the honest experiment is whether the CHANNEL alone closes the
                               # loop. Adding a privileged penalty on top would confound the one
                               # result this config exists to produce. It is the natural arm 2.
  # --- VL53L1X (measured, unchanged) ---
  tof_rate_hz: 25.0            # the honest measured rate (24.8-27.1 Hz, 2026-07-30), not the
                               # datasheet's 40
  tof_max_m: 1.3
  tof_tilt_limit_deg: 45.0
  # --- PMW3901 ---
  flow_rate_hz: 50.0           # counts ACCUMULATE between reads, so every control tick gets a
                               # fresh interval (unlike the ToF, which holds). PLACEHOLDER: the
                               # ToF's 40 -> 25 lesson says the delivered rate must be measured.
  flow_min_m: 0.08             # datasheet working range. A HARD OPTICAL LIMIT, not a knob — and
                               # the number the 0.20 m setpoint was chosen against.
  flow_tilt_limit_deg: 30.0    # tighter than the ToF's 45: tilt rotates the measured ground plane
                               # out from under the flat-floor assumption faster than it degrades
                               # a single ranging ray
  flow_dropout_prob: 0.02      # per-step speckle (low texture / low light). PLACEHOLDER.
  flow_blackout_prob: 0.0005   # per-step hazard of a SUSTAINED loss — a bare patch of desk, a
                               # shadow, a mat lifting in prop wash. This is the knob flow-hover
                               # did not have, and its absence was a real modeling gap: an i.i.d.
                               # 0.02 dropout loses a whole second with probability 1e-85, so a
                               # policy trained on speckle alone meets sustained blindness for the
                               # FIRST TIME in the air.
                               # THE RATE IS DERIVED FROM GATE 5, not guessed, and that is worth
                               # stating plainly. 0.0005/step = 0.025/s against a mean 0.75 s
                               # blackout is an 1.8% duty cycle, so the modeled availability
                               # CEILING is (1 - 0.02) * (1 - 0.018) = 0.962 — which leaves the
                               # battery's `flow_valid_rate >= 0.95` bar measuring what it is for:
                               # the POLICY's own contribution (flying below 0.08 m or past 30 deg
                               # of tilt), not my choice of dropout constant. It still puts ~0.8
                               # sustained losses in every 30 s episode. If the Phase-0 flight
                               # measures a higher real rate, this number moves AND gate 5's bar
                               # moves with it — the ceiling is arithmetic, not a target.
  flow_blackout_s: 1.5         # max blackout length (each draws uniform in (0, this]). Sized past
                               # the pilot's 1 s flow_lost abort window on purpose: the losses
                               # that end a flight have to be ones the policy has flown before.
  flow_scale_frac: 0.20        # per-episode multiplicative rad_per_count error, +-this. DERIVED,
                               # not guessed: the +23.9 mm uncalibrated ToF offset is 12% of a
                               # 0.20 m setpoint and enters the velocity scale one-for-one, and
                               # rad_per_count itself carries the slide test's own error on top.
                               # HELD at 0.20 rather than dropped to ~0.16 when the setpoint moved
                               # up: the offset is the only term of the two that is quantified, so
                               # the slack is headroom for the unmeasured one. Widening DR on an
                               # unmeasured axis is cheap; a policy that has never seen the real
                               # error is not. (flow-hover's 0.10 was the bench-calibration error
                               # ALONE, at a setpoint where the ToF offset was worth 6%.)
  flow_gyro_residual: 0.05     # per-episode residual fraction of ROTATIONAL flow the host's gyro
                               # compensation fails to remove. PLACEHOLDER.
  flow_blind_grace_s: 0.2      # mirrors the deployed --tof-blind-grace/--tof-blind-fade guard:
  flow_blind_fade_s: 0.3       # hold briefly, then fade to an HONEST zero ("I don't know that I'm
                               # moving") rather than assert a stale velocity forever

act:
  # The pilot has enforced min_thrust_frac 0.25 since 2026-07-31; mirroring it here is what stops
  # the policy learning a throttle profile the deploy path silently rewrites. act-v2 thrust -1.0
  # maps to motors off, which on this airframe is free fall AND a loss of rate authority.
  min_thrust_normed: 0.25

env:
  n_envs: 8192
  seed: 0
  obs_stack: 8

dr:
  enabled: true
  # Wind stays at DESK-HOVER'S 0.15, not flow-hover's 0.40. flow-hover restored wind because the
  # policy can now SEE it and its box was +-1.2 m; this box is +-0.6 m, where drag alone
  # (acc = -(D_xy/m)*v, D_xy ~ 0.10, m ~ 0.032 -> tau ~ 0.32 s) turns 0.40 m/s^2 into 0.06-0.13 m/s
  # of terminal drift — a sixth of the box per second. Holding the desk's DR fixed is also what
  # keeps this battery comparable to Desk-Hover's; the wind question is its own experiment, not a
  # free rider on this one.
  wind_accel_mps2: 0.15
  rate_gain_frac: 0.15
  thrust_scale_frac: 0.05
  obs_noise_std: 0.0           # superseded by the per-channel list below
  # 8 channels. The first six are Desk-Hover's MEASURED values, unchanged: h_err 0.010 (a 2.4 mm
  # static sigma and an airborne trace monotone in ~10 mm steps — i.e. QUANTIZATION, which no
  # Gaussian fixes; there is no quantization seam in randomization.py and that gap is real).
  # The two flow entries are flow-hover's 0.03 at 0.40 m rescaled by HEIGHT, since one count of
  # jitter is worth counts/dt * rad_per_count * h: 0.03 * 0.20/0.40 = 0.015. Arithmetic on a
  # placeholder is still a placeholder.
  #                        [roll,  pitch, p,     q,    r,    h_err, vx,    vy   ]
  obs_noise_std_channels: [0.02,  0.02,  1.25,  1.1,  0.75, 0.010, 0.015, 0.015]
  obs_noise_amp_range:    [0.5, 2.0]
  # The h_err BIAS stays 0.03: the +23.9 mm static ToF offset is real and uncalibrated, and at a
  # 0.20 m setpoint it is still a first-order effect (12%). Flow BIAS is deliberately 0 — a blind
  # PMW3901 reports ZERO, not an offset (that is the fade path), and the real calibration error
  # for this sensor is MULTIPLICATIVE, which an additive DR channel cannot express: it is drawn
  # in-task as flow_scale_frac.
  obs_bias_channels:      [0.0,   0.0,   0.05,  0.05, 0.05, 0.03,  0.0,   0.0  ]
  action_latency_steps: 5
  # Desk-scale impulses: a 2.5 m/s shove crosses the whole +-0.6 m box in 0.24 s and is
  # unrecoverable BY CONSTRUCTION, so at the 1 m ladder's magnitudes the channel injects nothing
  # but unattributable variance. Scaled to the arena rather than deleted.
  impulse_prob: 0.01
  impulse_vel_mps: 0.5
  impulse_rate_rps: 2.0

# Air65 II + XIAO companion + the ~2 g PMW3901 breakout, on the measured 29.5-31.5 g bridge stack.
# Shifted up from Desk-Hover's [0.030, 0.028, 0.032]: training at the ToF-only mass would train
# the wrong airframe.
whoop:
  mass: [0.032, 0.030, 0.034]
  J_xy: [2.1e-5, 1.8e-5, 2.5e-5]
  J_z:  [3.5e-5, 3.0e-5, 4.0e-5]

ppo:
  total_steps: 3_200_000_000
  num_steps: 24
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  update_epochs: 4
  num_minibatches: 8
  clip_coef: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  hidden_sizes: [128, 128]
  activation: tanh
  init_log_std: -0.5
  dr_curriculum_frac: 0.5
  ckpt_interval_updates: 800
